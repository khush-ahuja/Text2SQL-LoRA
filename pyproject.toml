[project]
name = "text2sql-lora"
version = "1.0.0"
description = "LoRA fine-tuning of a small LLM for text-to-SQL, with execution-based evaluation"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
